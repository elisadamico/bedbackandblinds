  features:
    - "The Remington Collection from Sealy includes a revolutionary line of mattresses designed with cutting-edge features that prioritize your comfort and well-being. With a range of soft to ultra firm, it’s easy to find the feel that’s right for you. Each mattress includes moisture protect technology to help regulate your body temperature throughout the night. The Duraflex Edge replaces the traditional foam rail with a double row of edge coils that provide superior durability, while also enhancing the compatibility with adjustable bases by 25%! The Sealy Stability Plus Coil is an advanced version of the standard coils you’d find in other Sealy mattresses. Standard coil is 660 while the Stability Plus is 911 coils for increased support and more personalized comfort. The thoughtful construction of these mattress help you discover a world of luxurious rest- it’s time to invest in the future of your sleep"

